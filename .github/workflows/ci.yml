name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[production]'
      - name: Publication checks
        run: ./scripts/check-publication.sh
      - name: Test
        run: PYTHONPATH=src python -m unittest discover -s tests -v

  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL and Azurite integration
        run: docker compose --profile check run --rm postgres-check
