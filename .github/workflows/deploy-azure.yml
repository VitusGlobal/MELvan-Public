name: Deploy to Azure

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ vars.MELVAN_DEPLOYMENT_ENVIRONMENT }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ vars.MELVAN_DEPLOYMENT_ENVIRONMENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[production]'
      - name: Validate fork configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          MELVAN_RESOURCE_GROUP: ${{ vars.MELVAN_RESOURCE_GROUP }}
          MELVAN_LOCATION: ${{ vars.MELVAN_LOCATION }}
          MELVAN_APP_NAME: ${{ vars.MELVAN_APP_NAME }}
          MELVAN_FOUNDRY_RESOURCE_GROUP: ${{ vars.MELVAN_FOUNDRY_RESOURCE_GROUP }}
          MELVAN_FOUNDRY_ACCOUNT: ${{ vars.MELVAN_FOUNDRY_ACCOUNT }}
          MELVAN_FOUNDRY_PROJECT_ENDPOINT: ${{ vars.MELVAN_FOUNDRY_PROJECT_ENDPOINT }}
          MELVAN_MODEL: ${{ vars.MELVAN_MODEL }}
          MELVAN_COMMUNICATION_RESOURCE_GROUP: ${{ vars.MELVAN_COMMUNICATION_RESOURCE_GROUP }}
          MELVAN_COMMUNICATION_RESOURCE: ${{ vars.MELVAN_COMMUNICATION_RESOURCE }}
          MELVAN_EMAIL_ENDPOINT: ${{ vars.MELVAN_EMAIL_ENDPOINT }}
          MELVAN_EMAIL_SENDER: ${{ vars.MELVAN_EMAIL_SENDER }}
          MELVAN_INITIAL_ADMIN_EMAIL: ${{ vars.MELVAN_INITIAL_ADMIN_EMAIL }}
        run: PYTHONPATH=src python -m melvan.preflight --profile local --azure-deployment
      - name: Sign in with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy hosted demonstration
        env:
          MELVAN_RESOURCE_GROUP: ${{ vars.MELVAN_RESOURCE_GROUP }}
          MELVAN_LOCATION: ${{ vars.MELVAN_LOCATION }}
          MELVAN_APP_NAME: ${{ vars.MELVAN_APP_NAME }}
          MELVAN_FOUNDRY_RESOURCE_GROUP: ${{ vars.MELVAN_FOUNDRY_RESOURCE_GROUP }}
          MELVAN_FOUNDRY_ACCOUNT: ${{ vars.MELVAN_FOUNDRY_ACCOUNT }}
          MELVAN_FOUNDRY_PROJECT_ENDPOINT: ${{ vars.MELVAN_FOUNDRY_PROJECT_ENDPOINT }}
          MELVAN_MODEL: ${{ vars.MELVAN_MODEL }}
          MELVAN_COMMUNICATION_RESOURCE_GROUP: ${{ vars.MELVAN_COMMUNICATION_RESOURCE_GROUP }}
          MELVAN_COMMUNICATION_RESOURCE: ${{ vars.MELVAN_COMMUNICATION_RESOURCE }}
          MELVAN_EMAIL_ENDPOINT: ${{ vars.MELVAN_EMAIL_ENDPOINT }}
          MELVAN_EMAIL_SENDER: ${{ vars.MELVAN_EMAIL_SENDER }}
          MELVAN_CUSTOM_DOMAIN: ${{ vars.MELVAN_CUSTOM_DOMAIN }}
          MELVAN_INITIAL_ADMIN_EMAIL: ${{ vars.MELVAN_INITIAL_ADMIN_EMAIL }}
        run: ./scripts/deploy-azure.sh
